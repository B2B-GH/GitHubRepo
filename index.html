<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayyina To Bayna Institute | Exam Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e112c; /* Rich dark purple to match logo core */
            background-image: radial-gradient(rgba(212, 175, 55, 0.15) 1px, transparent 0),
                              linear-gradient(to right, rgba(212, 175, 55, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
            background-size: 24px 24px, 48px 48px, 48px 48px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .container {
            background: linear-gradient(145deg, #321947, #1e0e2b); /* Premium dark purple gradient */
            padding: 3rem 2.5rem;
            border-radius: 24px;
            border: 2px solid #d4af37; /* Royal Gold Border */
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 440px;
            width: 90%;
            position: relative;
        }
        .logo-container {
            margin-bottom: 1.5rem;
        }
        .logo-img {
            max-width: 160px;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }
        h1 {
            margin-top: 0;
            margin-bottom: 0.25rem;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 700;
        }
        .subtitle {
            color: #d4af37; /* Gold Accent Name */
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        p {
            color: #cbd5e1;
            margin-bottom: 2.5rem;
            font-size: 1rem;
            line-height: 1.5;
        }
        .quiz-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .quiz-item {
            margin-bottom: 1.25rem;
        }
        .quiz-link {
            display: block;
            padding: 1.1rem;
            background: transparent;
            color: #d4af37;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            border: 1.5px solid #d4af37;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .quiz-link:hover {
            background-color: #d4af37;
            color: #1e112c;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
        }
        .quiz-link:active {
            transform: translateY(-1px);
        }
        .footer-logo {
            margin-top: 2rem;
            font-size: 1.5rem;
            color: rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo block linked to your uploaded image -->
        <div class="logo-container">
            <img class="logo-img" src="./logo.png" alt="Bayyina To Bayna Institute Logo">
        </div>

        <h1>Dream Exam Portal</h1>
        <div class="subtitle">Bayyina To Bayna Institute</div>
        <p>Select an exam below to begin testing your language skills.</p>
        
        <ul class="quiz-list">
            <li class="quiz-item">
                <a class="quiz-link" href="./Dream-Exam-1/index.html">Start Dream Exam 1</a>
            </li>
            <li class="quiz-item">
                <a class="quiz-link" href="./Dream-Exam-2/index.html">Start Dream Exam 2</a>
            </li>
        </ul>
        
        <div class="footer-logo">❊</div>
    </div>

</body>
</html>
